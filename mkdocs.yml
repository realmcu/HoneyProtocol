site_name: 智能手环蓝牙私有通信协议
site_url: https://realmcu.github.io/HoneyProtocol/
repo_url: https://github.com/realmcu/HoneyProtocol
repo_name: realmcu/HoneyProtocol
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
      primary: blue grey
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
      primary: blue grey
      accent: blue

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid.min.js

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 概述: index.md
  - 1 名词解释与约定: conventions.md
  - 2 协议结构介绍: architecture.md
  - 3 L2 Command 详解:
      - commands/index.md
      - 0x01 固件升级: commands/0x01-firmware-upgrade.md
      - 0x02 设置: commands/0x02-settings.md
      - 0x03 绑定: commands/0x03-bind.md
      - 0x04 提醒: commands/0x04-reminder.md
      - 0x05 运动数据: commands/0x05-sport-data.md
      - 0x06 工厂测试: commands/0x06-factory-test.md
      - 0x07 控制: commands/0x07-control.md
      - 0x08 Dump Stack: commands/0x08-dump-stack.md
      - 0x09 测试 Flash 读取: commands/0x09-flash-read.md
      - 0x0a 日志: commands/0x0a-log.md
      - 0x0c BLE 连接参数: commands/0x0c-ble-conn-param.md
      - 0x0d WiFi 配网: commands/0x0d-wifi-provision.md
      - 0x10 文件传输: commands/0x10-file-transfer.md
  - 附录：关键数据结构速查: appendix.md
